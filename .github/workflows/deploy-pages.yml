name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Pages artifact
        run: npm run build:pages
        env:
          DOC_PAGES_CUSTOM_DOMAIN: departmentofconsent.com
          VITE_SITE_URL: https://departmentofconsent.com
          VITE_GOOGLE_ANALYTICS_ID: G-GYYJEDCDTZ
          VITE_FOURTHWALL_STOREFRONT_TOKEN: ${{ secrets.FOURTHWALL_STOREFRONT_TOKEN }}
          VITE_NEWSLETTER_PROVIDER: kit
          VITE_NEWSLETTER_ENDPOINT: https://app.kit.com/forms/9683945/subscriptions
          VITE_NEWSLETTER_EMAIL_FIELD: email_address

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
